{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>{{ page_title }}</title>
        <link rel="stylesheet" href="https://jsdelivr.net" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/capapp.css' %}">
    </head>
    <body style="background-color: #000000; color: #ffffff; margin: 0; padding: 0;">
        
        <header class="page-header" style="background-color: #5694ea; padding: 40px 20px; text-align: center; margin-bottom: 40px;">
            <h1 class="main-heading" style="font-family: 'Lobster', sans-serif !important;">
                {{ page_title }}
            </h1>
        </header>

        <main class="container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
            {% for guardian in guardian_data %}
                <article class="card p-3 mb-3 shadow-sm" style="background-color: #1a1a1a; border: 1px solid #333; border-radius: 10px;">
                    <h2 style="font-size: 1.5rem; color: #5694ea; margin-bottom: 8px;">
                        {{ guardian.title }}
                    </h2>
                    
                    <p style="color: #cccccc; margin: 0;">
                        {{ guardian.text|linebreaksbr }}
                    </p>
                </article>
            {% empty %}
                <p style="text-align: center; color: #6c757d; margin-top: 40px;">
                    No student records found matching this list view criteria.
                </p>
            {% endfor %}
        </main>
    </body>
</html>
