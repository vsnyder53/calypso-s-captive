{% extends 'blog/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <form class="col-md-6 mx-auto card p-4 shadow-lg welcome-container" method="post" enctype="multipart/form-data">
        {% csrf_token %}  

        <h1 style="text-align: center;">
            <span class="welcome-heading">Student Center</span>
        </h1>
        <h3 class="mt-3">Login</h3>
        <hr>
        {% if messages %}
        <div class="alert alert-primary text-start" role="alert">
            {% for message in messages %}
                <div class="small fw-semibold">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="form-group text-start mb-3">
            <label for="exampleInputEmail1" class="fw-semibold">Username</label>
            <input type="text" class="form-control" name="username" id="exampleInputEmail1" aria-describedby="emailHelp"
                placeholder="Enter username" required>
        </div>

        <div class="form-group text-start mb-4">
            <label for="exampleInputPassword1" class="fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" id="exampleInputPassword1" placeholder="Password" required>
        </div>

        <p class="text-center small text-muted">
            Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none">Register here</a>
        </p>

        <div class="text-center">
            <button type="submit" class="btn btn-custom-blue w-100 py-2">Submit</button>
        </div>
    </form>
</div>
{% endblock %}
