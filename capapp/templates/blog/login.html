{% extends 'blog/base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 450px; margin: 60px auto; padding: 30px; background-color: #1a1a1a; border: 1px solid #333333; border-radius: 8px; color: #ffffff; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: Arial, sans-serif;">

    <form method="POST" class="login-form">
        {% csrf_token %}  

        <h2 style="font: sans-serif, !important; color: #5694ea; font-size: 24pt; margin: 0 0 10px 0;">
            Student Center
        </h2>
        <h3 style="font-size: 13pt; color: #ebecef; margin-bottom: 20px; font-weight: normal;">Account Login</h3>
        <hr style="border: 0; border-top: 1px solid #2d2d2d; margin-bottom: 25px;">

        {% if messages %}
        <div style="margin-bottom: 20px; text-align: left;">
            {% for message in messages %}
                <div style="background-color: #2c0b0e; color: #ea868f; padding: 10px; border-radius: 4px; font-size: 10pt; font-weight: bold;">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <div style="text-align: left; margin-bottom: 20px;">
            <label for="id_username" style="display: block; font-size: 11pt; font-weight: bold; margin-bottom: 8px; color: #ebecef;">Username</label>
            <input type="text" name="username" id="id_username" placeholder="Enter username" required
                style="width: 100%; padding: 12px; background-color: #000000; border: 2px solid #333333; border-radius: 4px; color: #ffffff; box-sizing: border-box; font-size: 11pt;">
        </div>

        <div style="text-align: left; margin-bottom: 25px;">
            <label for="id_password" style="display: block; font-size: 11pt; font-weight: bold; margin-bottom: 8px; color: #ebecef;">Password</label>
            <input type="password" name="password" id="id_password" placeholder="Password" required
                style="width: 100%; padding: 12px; background-color: #000000; border: 2px solid #333333; border-radius: 4px; color: #ffffff; box-sizing: border-box; font-size: 11pt;">
        </div>

        <div style="margin-bottom: 20px;">
            <button type="submit" style="width: 100%; padding: 12px; background-color: #5694ea; color: #000000; border: none; border-radius: 4px; font-size: 12pt; font-weight: bold; cursor: pointer;">
                Sign In
            </button>
        </div>

        <p style="margin: 0; font-size: 10.5pt; color: #888888;">
            Don't have an account? <a href="{% url 'register' %}" style="color: #5694ea; text-decoration: none; font-weight: bold;">Register here</a>
        </p>
    </form>
</div>
{% endblock %}
