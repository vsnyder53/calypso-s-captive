{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Welcome</title>
        <link rel="stylesheet" href="https://jsdelivr.net" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/capapp.css' %}">
    </head>
    <body>
        <header class="page-header" style="background-color: #5694ea; padding: 15px 0; margin-bottom: 20px;">
            <div class="container d-flex justify-content-between align-items-center">
                <h1 style="margin: 0;"><a href="/" style="font-family: 'Lobster', sans-serif; color: #ebecef; text-decoration: none; font-size: 28pt;">Student Center Home</a></h1>
                <div class="top-menu">
                    <a href="{% url 'home' %}" class="menu-icon" style="color: #ffffff; margin-left: 15px;">
                        {% include './icons/justify.svg' %}
                    </a>
                    <a href="{% url 'student_scan' %}" class="menu-icon" style="color: #ffffff; margin-left: 15px;">
                        {% include './icons/plus-square.svg' %}
                    </a>
                </div>
            </div>
        </header>

        {% if request.user.is_authenticated %}
        <div class="container my-4">
            <nav class="home-nav-container">
                <ul class="flat-menu">
                    <li><a href="{% url 'student_scan' %}">Student Scan</a></li>
                    <li><a href="{% url 'my_students' %}">My Students</a></li>
                    <li><a href="{% url 'guardian' %}">All Guardians</a></li>
                </ul>
            </nav>
        </div>
        {% endif %}

        <main class="content container">
            <div class="row">
                <div class="col">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </main>
    </body>
</html>
